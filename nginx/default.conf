# Site statique du Vieux Comptoir, derrière Traefik (TLS terminé en amont par Cloudflare).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Pages : toujours revalidées, elles référencent les assets du déploiement.
  location / {
    include /etc/nginx/vieux-comptoir/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html =404;
  }

  # Assets d'Astro, nommés par leur empreinte de contenu (images, polices, scripts).
  location ^~ /_astro/ {
    include /etc/nginx/vieux-comptoir/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Un fichier absent répond 404 sans être mis en cache.
  error_page 404 /404-vieux-comptoir;
  location = /404-vieux-comptoir {
    internal;
    include /etc/nginx/vieux-comptoir/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    return 404;
  }
}
