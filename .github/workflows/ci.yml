name: CI

# Site vérifié sur chaque PR et sur master, puis son image Docker construite et vérifiée. Sur master,
# l'image part sur GHCR et Dokploy redéploie la pile en relisant deploy/compose.yaml dans le dépôt
# (voir deploy/README.md).
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Un run par branche/PR : le nouveau push annule le précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Lint · Format · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install (frozen lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build

  # Image de production : construite et vérifiée sur chaque PR, publiée et déployée depuis master.
  image:
    name: Image · Build · Vérification · GHCR
    needs: [site]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/vieux-comptoir-web
      SOURCE: https://github.com/${{ github.repository }}
      PUBLISH: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: >-
          docker build
          --label "org.opencontainers.image.source=$SOURCE"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -t "$IMAGE:sha-$GITHUB_SHA" -t "$IMAGE:latest" .

      - name: Vérification de l'image
        run: ci/verify-image.sh "$IMAGE:sha-$GITHUB_SHA"

      # Le script de déclenchement est jugé devant un faux Dokploy : une redirection ou un refus
      # doivent échouer, jamais passer pour un déploiement.
      - name: Vérification du déclencheur Dokploy
        run: deploy/trigger-deploy.check.sh

      # Dokploy lit deploy/compose.yaml dans le dépôt : un fichier invalide ne doit pas atteindre master.
      - name: Vérification du compose
        run: deploy/compose.check.sh

      - name: Publication sur GHCR
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"

      # API Dokploy (`compose.deploy`). Sans les secrets, l'image est publiée et le déploiement reste
      # manuel. Le panneau étant derrière Cloudflare Access, le jeton de service passe par CF_ACCESS_*.
      - name: Déploiement Dokploy
        if: env.PUBLISH == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::notice::Secrets DOKPLOY_URL, DOKPLOY_API_KEY ou DOKPLOY_COMPOSE_ID absents, aucun déploiement"
            exit 0
          fi
          deploy/trigger-deploy.sh

      # Sonde du site après le déploiement, si son adresse est renseignée (variable du dépôt) : elle
      # prouve que le site répond, pas que la nouvelle version a remplacé l'ancienne.
      - name: Sonde du site
        if: env.PUBLISH == 'true' && vars.DEPLOY_HEALTH_URL != ''
        env:
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          curl --fail --silent --show-error --max-time 10 \
            --retry 18 --retry-delay 10 --retry-all-errors "$DEPLOY_HEALTH_URL" -o /dev/null
