# Pile de production du Vieux Comptoir sur le serveur, déployée par Dokploy (service de type Compose).
# Dokploy lit ce fichier dans le dépôt (branche master) à chaque déploiement et ne construit rien :
# il tire l'image publiée sur GHCR par la CI.
#
# - Aucun port publié : le trafic arrive par le tunnel Cloudflare, puis le Traefik de Dokploy, qui
#   joint `vieux-comptoir-web` par `dokploy-network`. Le domaine se règle dans l'onglet Domains de
#   Dokploy (service `vieux-comptoir-web`, port 8080), qui ajoute les labels Traefik.
# - Nom de service préfixé : `dokploy-network` est partagé avec les autres piles du serveur.
# - Retour à une version : fixer `WEB_IMAGE` sur un tag `sha-<commit>` et redéployer.

name: vieux-comptoir

services:
  vieux-comptoir-web:
    image: ${WEB_IMAGE:-ghcr.io/j-ned/vieux-comptoir-web:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
